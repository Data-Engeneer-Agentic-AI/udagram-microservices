services:
  - docker

before_script:
  - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

script:
  - docker build -t miloudmihoubi/udagram-api-feed ./udagram-api-feed
  - docker build -t miloudmihoubi/udagram-api-user ./udagram-api-user
  - docker build -t miloudmihoubi/udagram-frontend ./udagram-frontend
  - docker build -t miloudmihoubi/reverseproxy ./udagram-reverseproxy

after_success:
  - docker push miloudmihoubi/udagram-api-feed
  - docker push miloudmihoubi/udagram-api-user
  - docker push miloudmihoubi/udagram-frontend
  - docker push miloudmihoubi/reverseproxy